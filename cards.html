<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/cards.css">
    <title>Food</title>
</head>
<body>
    <div class="search">
        <input type="text" id="search-input" placeholder="Search for food...">
        <div class="sort-btn">
            <p class="sort">A-Z</p>
            <p class="sort">Z-A</p>
            <p class="sort">None</p>
        </div>
    </div>
    <section id="cards-container">
    </section>
    <div class="form">
        <h2>Contacts Us</h2>
        <label id="user-label" class="label">Username</label>
            <input id="username" type="text">
        <label id="email-label" class="label">E-mail</label>
            <input id="email" type="text">
        <label id="message-label" class="label">Message</label>
            <textarea id="message"></textarea>
        <div class="warning">
            <h2 id="war-message"></h2>
        </div>
        <button class="btn" id="submit" type="submit">Submit</button>
    </div>
    <script src="src/js/cards.js"></script>
</body>
</html>
